---
- name: Require a supported system
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] in ["Debian", "RedHat"]
      - ansible_facts['architecture'] == "x86_64"
    fail_msg: >-
      Пакеты в files/ для x86_64 на Debian, Ubuntu или RHEL-подобной системе.
      На {{ inventory_hostname }}: {{ ansible_facts['os_family'] }}, {{ ansible_facts['architecture'] }}.

- name: Check the role variables
  ansible.builtin.assert:
    that:
      - openbao_version | length > 0
      - openbao_auto_unseal is none or openbao_auto_unseal | string | lower in ['', 'true', 'false', 'yes', 'no', '1', '0', 'on', 'off']
      - ((openbao_files_dir ~ '/tls.crt') is file) == ((openbao_files_dir ~ '/tls.key') is file)
    fail_msg: >-
      Проверьте переменные: openbao_auto_unseal — true, false или пусто;
      для своего сертификата нужны оба файла, files/tls.crt и files/tls.key.

- name: Pick the package for this host
  ansible.builtin.set_fact:
    openbao_package: >-
      openbao_{{ openbao_version }}_linux_amd64.{{ 'deb' if ansible_facts['os_family'] == 'Debian' else 'rpm' }}
    openbao_own_cert: "{{ (openbao_files_dir ~ '/tls.crt') is file }}"
    openbao_auto_unseal_env: >-
      {{ '' if openbao_auto_unseal is none or openbao_auto_unseal | string == ''
         else ('1' if openbao_auto_unseal | bool else '0') }}

- name: Create the installer directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ openbao_bundle_dir }}"
    - "{{ openbao_bundle_dir }}/files"

# install.sh checks the package against checksums.txt on the host before installing it.
- name: Copy the installer and the package
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ openbao_bundle_dir }}/{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: "{{ openbao_installer }}", dest: install.sh, mode: "0700" }
    - { src: "{{ openbao_files_dir }}/openbao-unseal", dest: files/openbao-unseal, mode: "0700" }
    - { src: "{{ openbao_files_dir }}/checksums.txt", dest: files/checksums.txt, mode: "0600" }
    - { src: "{{ openbao_files_dir }}/{{ openbao_package }}", dest: "files/{{ openbao_package }}", mode: "0600" }
  loop_control:
    label: "{{ item.dest }}"

- name: Copy the supplied TLS certificate and key
  ansible.builtin.copy:
    src: "{{ openbao_files_dir }}/{{ item }}"
    dest: "{{ openbao_bundle_dir }}/files/{{ item }}"
    owner: root
    group: root
    mode: "0600"
  loop: [tls.crt, tls.key]
  when: openbao_own_cert | bool
  diff: false

- name: Drop a certificate that is no longer supplied
  ansible.builtin.file:
    path: "{{ openbao_bundle_dir }}/files/{{ item }}"
    state: absent
  loop: [tls.crt, tls.key]
  when: not (openbao_own_cert | bool)

# stdin from /dev/null: over SSH Ansible gives the module a terminal, and
# openbao-unseal would wait for a key typed into it.
- name: Run install.sh
  ansible.builtin.shell:
    cmd: bash {{ (openbao_bundle_dir ~ '/install.sh') | quote }} </dev/null
  environment:
    OPENBAO_API_ADDR: "{{ openbao_api_addr }}"
    OPENBAO_CLUSTER_ADDR: "{{ openbao_cluster_addr }}"
    OPENBAO_FIREWALL: "{{ '1' if openbao_firewall | bool else '0' }}"
    OPENBAO_AUTO_UNSEAL: "{{ openbao_auto_unseal_env | trim }}"
  register: openbao_install
  changed_when: "'Изменений нет.' not in openbao_install.stdout_lines"

- name: Show what install.sh did
  ansible.builtin.debug:
    msg: "{{ openbao_install.stdout_lines | reject('match', '^$') | list }}"
