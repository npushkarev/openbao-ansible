---
# The role copies install.sh and the package to the host and runs install.sh there,
# so a playbook run and a manual 'sudo ./install.sh' do exactly the same thing.
openbao_installer: "{{ playbook_dir }}/install.sh"
openbao_files_dir: "{{ playbook_dir }}/files"
# Taken from install.sh, so the version is changed in one place only.
openbao_version: >-
  {{ lookup('ansible.builtin.file', openbao_installer)
     | regex_search('(?m)^VERSION="([^"]+)"', '\1') | first }}

# Where the installer stays on the host. 'sudo bash /root/openbao-install/install.sh'
# can be re-run from there by hand.
openbao_bundle_dir: /root/openbao-install

# Address clients use; the certificate is issued for it. install.sh rewrites
# openbao.hcl only when this differs from the address already in it.
# Empty: keep the address from the existing config, or detect it on the host.
openbao_api_addr: "https://{{ ansible_host | default(inventory_hostname, true) }}:8200"
openbao_cluster_addr: ""

# Open 8200/tcp in firewalld or ufw when one of them is running.
openbao_firewall: true

# true: unseal automatically after every start of the service, with the key
# from /root/openbao-init.txt. false: turn it off. Empty: leave as it is.
openbao_auto_unseal: ""
